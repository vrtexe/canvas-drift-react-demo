<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- canvas-glide: a viewport tile with content mid-glide —
       a bright panel offset toward the corner, clipped by the frame,
       trailed by a motion ghost. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <clipPath id="viewport">
      <rect x="4" y="4" width="56" height="56" rx="14"/>
    </clipPath>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bg)"/>
  <g clip-path="url(#viewport)">
    <rect x="13" y="13" width="52" height="40" rx="8" fill="#ffffff" opacity="0.22"/>
    <rect x="23" y="23" width="52" height="40" rx="8" fill="#ffffff" opacity="0.94"/>
  </g>
</svg>
